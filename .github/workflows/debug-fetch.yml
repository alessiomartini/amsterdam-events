name: Debug fetch (dump raw HTML)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npx tsx scripts/debug-geocode.ts
      - name: Commit raw HTML to this branch
        run: |
          git config user.name "amsterdam-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f debug-html
          git commit -m "debug: raw HTML snapshot" --allow-empty
          git push
